name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DynamicIsland.sln

      - name: Build
        run: dotnet build DynamicIsland.sln -c Release --no-restore

      - name: Test
        run: dotnet test DynamicIsland.sln -c Release --no-build

      - name: Publish self-contained
        run: .\scripts\publish.ps1 -NoZip
        shell: pwsh

      - name: Read and validate version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match VERSION $version."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Create release archive
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $source = "artifacts/publish/DynamicIsland-$version-win-x64"
          $zip = "artifacts/publish/DynamicIsland-$version-win-x64.zip"
          Compress-Archive -Path (Join-Path $source '*') -DestinationPath $zip -Force

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Dynamic Island v${{ steps.version.outputs.version }}
          files: artifacts/publish/DynamicIsland-${{ steps.version.outputs.version }}-win-x64.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
